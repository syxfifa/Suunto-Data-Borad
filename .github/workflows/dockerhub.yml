name: Build Suunto Data Borad

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: jjsyx123
  SUUNTO_IMAGE: suunto-data-borad:local

concurrency:
  group: suunto-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=VERSION::Use a version in MAJOR.MINOR.PATCH format."
            exit 1
          fi
          if [[ -n "$BEFORE_SHA" ]] && git cat-file -e "$BEFORE_SHA:VERSION" 2>/dev/null; then
            previous="$(git show "$BEFORE_SHA:VERSION")"
            if [[ "$version" != "$previous" && "$(printf '%s\n' "$previous" "$version" | sort -V | tail -1)" != "$version" ]]; then
              echo "::error file=VERSION::A release version cannot decrease."
              exit 1
            fi
            if [[ "$version" == "$previous" ]] && ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              suunto tests Dockerfile requirements.txt .dockerignore docker-compose.yml .github/workflows/dockerhub.yml; then
              echo "::error file=VERSION::Increase VERSION when changing application, image, or deployment files."
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build image for NAS architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          tags: ${{ env.SUUNTO_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$SUUNTO_IMAGE" \
              python -m unittest discover -s tests -v
          done
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify OAuth and date filtering in Chromium
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
          PYTHONPATH=. python tests/browser_smoke.py
      - name: Verify Compose startup and volume persistence
        run: |
          override="$RUNNER_TEMP/suunto-ci-compose.yml"
          export COMPOSE_FILE="docker-compose.yml:$override"
          export COMPOSE_PROJECT_NAME="suunto-fresh-ci"
          printf 'services:\n  app:\n    image: "%s"\n' "$SUUNTO_IMAGE" > "$override"
          docker compose config --quiet
          test "$(docker compose config --services)" = app
          docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error --data "minutes=15" http://127.0.0.1:7383/settings
          docker compose exec -T --user 10001:10001 app python - <<'PY'
          from pathlib import Path
          from suunto.store import SCHEMA_VERSION, Store
          status = dict(line.split(":", 1) for line in Path("/proc/1/status").read_text().splitlines() if ":" in line)
          assert status["Uid"].split() == status["Gid"].split() == ["10001"] * 4
          assert int(status["CapEff"], 16) == int(status["CapPrm"], 16) == 0
          store = Store("/data")
          assert store.query("PRAGMA user_version")[0]["user_version"] == SCHEMA_VERSION
          at = "2026-01-01T08:00:00+08:00"
          run = store.start("fresh_fixture", at)
          store.commit(run, "workouts", [("fixture-activity", at, {"workoutId": "fixture-activity", "totalDistance": 1000})])
          PY
          docker inspect "$(docker compose ps -q app)" \
            --format '{{.Name}}:{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}:{{.Source}}{{end}}{{end}}' \
            | grep -Fx "/suunto-data-borad:bind:$(pwd -P)/suunto-storage"
          docker compose down
          docker compose run --rm --no-deps --entrypoint sh app -ec \
            'chown 0:0 /data /data/.maintenance.lock /data/suunto.sqlite /data/config.json'
          docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error http://127.0.0.1:7383/healthz
          probe="$(docker compose exec -T --user 10001:10001 app python -m suunto probe)" || test "$?" -eq 1
          printf '%s\n' "$probe" | python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "authorization_required"'
          docker compose exec -T --user 10001:10001 app python -c 'from suunto.store import Store; assert Store("/data").record("workouts", "fixture-activity")["totalDistance"] == 1000'
          docker compose exec -T --user 10001:10001 app python -c 'import json; from pathlib import Path; assert json.loads(Path("/data/config.json").read_bytes())["sync_interval_minutes"] == 15'
          umask 077
          snapshot="$RUNNER_TEMP/suunto-backup-ci.zip"
          docker compose exec -T --user 10001:10001 app python -m suunto backup > "$snapshot"
          docker compose exec -T --user 10001:10001 app python -m suunto verify --record < "$snapshot"
          docker compose exec -T --user 10001:10001 app python -c 'from suunto.maintenance import last_verified_backup; assert last_verified_backup("/data")'
          docker compose down
          restored="$RUNNER_TEMP/suunto-restore-data"
          printf 'services:\n  app:\n    image: "%s"\n    volumes:\n      - "%s:/data"\n' \
            "$SUUNTO_IMAGE" "$restored" > "$override"
          docker compose -p suunto-restore-ci run --rm --no-deps -T app python -m suunto restore < "$snapshot"
          docker compose -p suunto-restore-ci run --rm --no-deps -T app python -m suunto restore --component settings < "$snapshot"
          docker compose -p suunto-restore-ci up -d --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error http://127.0.0.1:7383/healthz
          curl --fail --silent --show-error http://127.0.0.1:7383/diagnostics.json
          docker compose -p suunto-restore-ci exec -T --user 10001:10001 app python - <<'PY'
          import json
          from pathlib import Path
          from suunto.store import Store
          assert Store("/data").record("workouts", "fixture-activity")["totalDistance"] == 1000
          assert json.loads(Path("/data/config.json").read_bytes())["sync_interval_minutes"] == 15
          PY
      - name: Verify upgrade from the previous release with persisted data
        run: |
          previous="docker.io/${DOCKERHUB_USERNAME,,}/suunto-data-borad:1.0.6"
          data="$(mktemp -d "$RUNNER_TEMP/suunto-upgrade-XXXXXX")"
          old="suunto-upgrade-old-${GITHUB_RUN_ID}"
          candidate="suunto-upgrade-new-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$old" "$candidate" >/dev/null 2>&1 || true' EXIT
          function start_image() {
            docker run -d --network none --name "$1" --mount "type=bind,src=$data,dst=/data" "$2"
            for attempt in {1..30}; do
              if docker exec --user 10001:10001 "$1" python -c 'from urllib.request import urlopen; urlopen("http://127.0.0.1:7383/healthz", timeout=2).close()' 2>/dev/null; then
                return
              fi
              sleep 1
            done
            docker logs "$1"
            return 1
          }
          docker pull "$previous"
          start_image "$old" "$previous"
          docker exec -i --user 10001:10001 "$old" python - <<'PY'
          from pathlib import Path
          from suunto.config import Config
          from suunto.mcp import save_json
          from suunto.store import Store
          data = Path("/data")
          Config(data).save(26)
          save_json(data / "token.json", {"access_token": "offline-fixture", "expires_at": 0, "refresh_at": 0})
          save_json(data / "amap.json", {"enabled": False, "coordinates": "gps"})
          at = "2026-01-01T08:00:00+08:00"
          store = Store(data)
          store.commit(store.start("upgrade_fixture", at), "workouts", [("upgrade", at, {"workoutId": "upgrade"})])
          PY
          docker stop "$old"
          start_image "$candidate" "$SUUNTO_IMAGE"
          docker exec -i --user 10001:10001 "$candidate" python - <<'PY'
          import json
          from pathlib import Path
          from suunto.config import Config
          from suunto.store import Store
          data = Path("/data")
          assert Store(data).record("workouts", "upgrade")["workoutId"] == "upgrade"
          assert Config(data).load() == 26
          assert Config(data, "amap.json").read() == {"enabled": False, "coordinates": "gps"}
          assert json.loads((data / "token.json").read_bytes())["access_token"] == "offline-fixture"
          PY
      - name: Show Compose logs when a check fails
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/suunto-ci-compose.yml" ]]; then
            export COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/suunto-ci-compose.yml"
            docker compose -p suunto-fresh-ci logs --no-color app
            docker compose -p suunto-restore-ci logs --no-color app
          fi
      - name: Check whether publishing is enabled
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials are missing; only test the image."
          fi
      - name: Sign in to Docker Hub
        if: steps.release.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested image
        if: steps.release.outputs.enabled == 'true'
        run: |
          repo="docker.io/${DOCKERHUB_USERNAME,,}/suunto-data-borad"
          short_sha="${GITHUB_SHA:0:12}"
          docker tag "$SUUNTO_IMAGE" "$repo:$short_sha"
          docker tag "$SUUNTO_IMAGE" "$repo:latest"
          if docker buildx imagetools inspect "$repo:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Version $RELEASE_VERSION is already available."
          else
            docker tag "$SUUNTO_IMAGE" "$repo:$RELEASE_VERSION"
            docker push "$repo:$RELEASE_VERSION"
          fi
          docker push "$repo:$short_sha"
          docker push "$repo:latest"
