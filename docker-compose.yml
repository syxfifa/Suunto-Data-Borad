services:
  app:
    image: "${SUUNTO_IMAGE:-docker.io/jjsyx123/suunto-data-borad:latest}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - suunto-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  suunto-data:
