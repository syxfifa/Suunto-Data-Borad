<div class="chart-grid {% if chart_layout is defined %}{{ chart_layout }}{% endif %}">
  {% for chart in chart_items %}
  <section class="chart-panel">
    {% if chart_heading == 'h3' %}<h3>{{ chart.title }}</h3>{% else %}<h2>{{ chart.title }}</h2>{% endif %}
    {% if chart.hint %}<p class="meta">{{ chart.hint }}</p>{% endif %}
    {% include "chart_values.html" %}
  </section>
  {% endfor %}
</div>
